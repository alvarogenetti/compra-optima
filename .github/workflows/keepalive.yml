name: mantener-despierto

# Render (plan gratis) duerme el servicio a los 15 minutos sin visitas y despertarlo tarda ~1 minuto.
# Este aviso cada 10 minutos lo mantiene despierto. Cuesta horas gratis de Render (un servicio 24/7 son
# ~744 de las 750 del mes, compartidas entre TODOS los servicios gratis de la cuenta). Para apagarlo:
# borrar este archivo. Detalle y límites: docs/OPERATIONS.md y docs/DECISIONS.md (ADR-016).
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub a veces la demora: de vez en cuando puede quedar un hueco > 15 min
  workflow_dispatch: {}

concurrency:
  group: mantener-despierto
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Una ruta real de la app (Render contesta solo algunas rutas, como robots.txt, sin despertar nada)
      - name: Avisar a la web
        run: curl -fsS -m 90 --retry 2 --retry-delay 5 https://compra-optima.onrender.com/api/status -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n"
