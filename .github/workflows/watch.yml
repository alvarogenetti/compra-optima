name: seguir-precios

on:
  schedule:
    - cron: "23 */3 * * *"   # cada 3 h (GitHub a veces la corre con demora)
  workflow_dispatch: {}      # botón "Run workflow" para correrlo a mano

concurrency:
  group: seguir-precios
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Escanear productos seguidos y avisar por Telegram
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COMPRA_BOT_TOKEN: ${{ secrets.COMPRA_BOT_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$COMPRA_BOT_TOKEN" ]; then
            echo "Faltan los secrets DATABASE_URL / COMPRA_BOT_TOKEN: no hay nada que escanear todavía."
            exit 0
          fi
          python -m core.watch

